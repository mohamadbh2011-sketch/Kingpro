<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CodeMarket</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

:root{
 --bg:#070707;--card:#111;--card2:#151515;--line:#292929;
 --red:#e50919;--red2:#ff3542;--white:#f7f7f7;--muted:#858585;
 --green:#24c77b;--yellow:#e8b84b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:Vazirmatn,sans-serif}
body{background:
 radial-gradient(circle at 85% -10%,rgba(229,9,25,.18),transparent 32%),
 radial-gradient(circle at -10% 40%,rgba(120,0,8,.10),transparent 28%),
 #070707}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.app{width:min(760px,100%);margin:auto;min-height:100vh;padding-bottom:105px}

.splash{
 position:fixed;z-index:9999;inset:0;background:#070707;
 display:flex;align-items:center;justify-content:center
}
.splash-box{text-align:center;width:90%;max-width:380px}
.logo{
 width:70px;height:70px;border-radius:23px;
 display:grid;place-items:center;
 background:linear-gradient(145deg,#ff3440,#750009);
 font-size:22px;font-weight:900;
 box-shadow:0 20px 70px rgba(229,9,25,.28)
}
.splash .logo{margin:auto}
.loader{
 width:42px;height:42px;border:3px solid #292929;
 border-top-color:var(--red);border-radius:50%;
 animation:spin .75s linear infinite;margin:25px auto 14px
}
@keyframes spin{to{transform:rotate(360deg)}}

header{
 display:flex;align-items:center;justify-content:space-between;
 padding:18px 16px 10px
}
.brand{font-size:21px;font-weight:900;letter-spacing:-.5px}
.brand span{color:var(--red)}
.icon-wrap{position:relative;display:inline-block}
.icon{
 width:43px;height:43px;border-radius:14px;
 background:#131313;color:#fff;border:1px solid #282828;
 display:grid;place-items:center;position:relative
}
.icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}
.badge-count{
 position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;
 font-size:10px;font-weight:800;padding:2px 6px;border-radius:10px;
 border:2px solid var(--bg)
}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;vertical-align:middle;margin-left:6px}

.page{padding:8px 16px}
.hero{
 border:1px solid #411014;border-radius:27px;padding:25px;
 background:linear-gradient(135deg,#27090c,#101010 65%);
 box-shadow:0 25px 80px rgba(0,0,0,.45)
}
.hero h1{margin:7px 0;font-size:27px;line-height:1.45}
.muted{color:var(--muted);font-size:12px;line-height:1.8}
.section{
 display:flex;align-items:center;justify-content:space-between;
 margin:25px 2px 12px
}
.section h2{font-size:17px;margin:0}
.card{
 background:linear-gradient(145deg,#151515,#101010);
 border:1px solid var(--line);
 border-radius:20px;padding:15px
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.course{padding:0;overflow:hidden}
.thumb{
 height:125px;display:grid;place-items:center;
 background:linear-gradient(135deg,#410a0f,#141414);
 color:#ff3542;font-weight:900;font-size:28px
}
.body{padding:13px}
.body h3{font-size:14px;margin:0 0 7px}
.price{font-weight:900}
.btn{
 width:100%;border:0;border-radius:14px;padding:12px;
 background:var(--red);color:#fff;font-weight:800;margin-top:10px;
 display:inline-flex;align-items:center;justify-content:center
}
.btn.secondary{background:#1c1c1c;border:1px solid #303030}
.btn.dark{background:#171717;border:1px solid #2a2a2a}
.btn.danger{background:#3a0a0e}
.input,.textarea,.select{
 width:100%;background:#0f0f0f;color:#fff;
 border:1px solid #292929;border-radius:15px;
 padding:13px 14px;outline:none
}
.input:focus,.textarea:focus,.select:focus{border-color:#8e151e}
.textarea{min-height:115px;resize:vertical}
.form{display:grid;gap:10px}
.tabs{
 display:flex;gap:4px;background:#171717;
 padding:4px;border-radius:15px;margin:18px 0
}
.tab{
 flex:1;border:0;background:transparent;color:#888;
 border-radius:11px;padding:10px
}
.tab.active{background:#35090d;color:#fff}
.bottom{
 position:fixed;z-index:50;bottom:10px;left:50%;
 transform:translateX(-50%);
 width:min(720px,calc(100% - 22px));
 display:grid;grid-template-columns:repeat(5,1fr);
 padding:8px;background:rgba(17,17,17,.88);
 border:1px solid #292929;border-radius:24px;
 backdrop-filter:blur(18px)
}
.nav{
 background:transparent;border:0;color:#777;
 border-radius:15px;padding:7px 3px;font-size:10px;position:relative
}
.nav svg{width:20px;height:20px;display:block;margin:auto auto 3px;fill:none;stroke:currentColor;stroke-width:1.8}
.nav.active{background:#35090d;color:var(--red)}
.nav.active svg{stroke:var(--red)}
.balance{font-size:28px;font-weight:900;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat strong{display:block;font-size:19px;margin-top:5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.divider{height:1px;background:#282828;margin:15px 0}
.modal{
 position:fixed;z-index:500;inset:0;background:rgba(0,0,0,.76);
 display:flex;align-items:flex-end;justify-content:center
}
.sheet{
 width:min(760px,100%);max-height:93vh;overflow:auto;
 background:#101010;border:1px solid #292929;
 border-radius:28px 28px 0 0;padding:20px
}
.toast{
 position:fixed;z-index:10000;top:18px;left:50%;
 transform:translate(-50%,-20px);
 opacity:0;pointer-events:none;
 background:#181818;border:1px solid #333;border-radius:14px;
 padding:11px 16px;font-size:12px;transition:.25s
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ok{color:var(--green)}.bad{color:#ff5b64}.warn{color:var(--yellow)}
.empty{text-align:center;color:#777;padding:30px 10px}
.stepper{display:flex;align-items:center;margin:20px 0 24px}
.step{
 width:31px;height:31px;border-radius:50%;
 background:#1b1b1b;border:1px solid #333;
 display:grid;place-items:center;color:#777;font-size:12px
}
.step.active{background:#5c0a10;border-color:var(--red);color:#fff}
.step.done{background:#1f6b49;border-color:#24c77b;color:#fff}
.step-line{height:1px;background:#303030;flex:1}
.step-title{text-align:center;margin:-9px 0 18px;font-weight:800}
.method{display:flex;gap:9px}
.method button{
 flex:1;border:1px solid #292929;background:#161616;
 color:#888;border-radius:15px;padding:13px
}
.method button.active{background:#35090d;color:#fff;border-color:#a3121b}
.info{
 background:#171717;border:1px solid #292929;
 border-radius:15px;padding:13px;font-size:12px;line-height:2
}
.address{
 direction:ltr;text-align:left;word-break:break-all;
 background:#090909;border:1px dashed #3a3a3a;
 border-radius:13px;padding:12px;margin-top:8px
}
.copyrow{display:flex;gap:8px;align-items:center}
.copyrow .address{flex:1}
.badge{
 display:inline-flex;padding:4px 8px;border-radius:8px;
 font-size:10px;background:#2b0a0e;color:#ff5963
}
.badge.blue{background:#10253a;color:#53b7ff}
.chat-message{max-width:82%;padding:11px 13px;border-radius:16px;margin:7px 0;font-size:12px;line-height:1.8}
.chat-message.me{margin-right:auto;background:#4a0b11}
.chat-message.support{margin-left:auto;background:#1b1b1b}
.blocked-banner{
 background:#3a0a0e;border:1px solid var(--red);color:#fff;
 padding:12px 16px;text-align:center;font-weight:700;font-size:13px;
 border-radius:14px;margin-bottom:15px
}
.accordion-item{background:#161616;border:1px solid #282828;border-radius:14px;margin:8px 0;overflow:hidden}
.accordion-header{padding:14px;display:flex;align-items:center;justify-content:between;cursor:pointer;font-weight:700}
.accordion-body{padding:0 14px 14px;border-top:1px solid #222;display:none}
.accordion-item.open .accordion-body{display:block}

/* Lesson Lock & Completion Styles */
.accordion-item.locked{opacity:0.6;background-color:#121212;border-color:#222}
.accordion-item.locked .accordion-header{cursor:not-allowed;color:#777}
.accordion-item.completed .accordion-header{border-right:4px solid var(--green)}
.lesson-footer{margin-top:15px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #222;padding-top:12px}
.lesson-status{font-size:12px;font-weight:700}

/* =========================================================
   CODEMARKET CUSTOM VIDEO PLAYER STYLES (ENHANCED)
   ========================================================= */
.cm-video-player{
 position:relative;
 width:100%;
 border-radius:20px;
 overflow:hidden;
 background:#000;
 border:1px solid var(--line);
 box-shadow:0 20px 50px rgba(0,0,0,0.85);
 margin-top:12px;
 user-select:none;
}
.cm-video-player video{
 width:100%;
 display:block;
 cursor:pointer;
}
.cm-video-overlay{
 position:absolute;
 inset:0;
 display:grid;
 place-items:center;
 background:rgba(0,0,0,0.4);
 transition:opacity 0.3s ease;
 cursor:pointer;
}
.cm-video-player.playing .cm-video-overlay{
 opacity:0;
 pointer-events:none;
}
.cm-big-play-btn{
 width:74px;
 height:74px;
 border-radius:50%;
 background:linear-gradient(135deg,var(--red2),var(--red));
 color:#fff;
 display:grid;
 place-items:center;
 box-shadow:0 0 40px rgba(229,9,25,0.7);
 transition:transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s;
}
.cm-big-play-btn svg{
 width:30px;
 height:30px;
 margin-left:3px;
 fill:currentColor;
}
.cm-video-player:hover .cm-big-play-btn{
 transform:scale(1.12);
}
.cm-video-controls{
 position:absolute;
 bottom:0;left:0;right:0;
 background:linear-gradient(transparent, rgba(0,0,0,0.92) 70%);
 padding:25px 16px 14px;
 opacity:0;
 transition:opacity 0.3s ease;
}
.cm-video-player:hover .cm-video-controls,
.cm-video-player.paused .cm-video-controls{
 opacity:1;
}
.cm-progress-container{
 height:8px;
 background:rgba(255,255,255,0.22);
 border-radius:4px;
 cursor:pointer;
 margin-bottom:12px;
 position:relative;
 overflow:hidden;
}
.cm-progress-bar{
 height:100%;
 background:linear-gradient(90deg,var(--red),var(--red2));
 border-radius:4px;
 width:0%;
 position:relative;
 pointer-events:none;
}
.cm-progress-bar::after{
 content:'';
 position:absolute;
 right:-6px;top:50%;
 transform:translateY(-50%);
 width:14px;height:14px;
 background:#fff;border-radius:50%;
 box-shadow:0 0 10px rgba(0,0,0,0.8);
 opacity:0;
 transition:opacity 0.2s;
}
.cm-progress-container:hover .cm-progress-bar::after{
 opacity:1;
}
.cm-controls-row{
 display:flex;
 align-items:center;
 justify-content:space-between;
}
.cm-controls-left, .cm-controls-right{
 display:flex;
 align-items:center;
 gap:10px;
}
.cm-control-btn{
 background:transparent;
 border:0;color:#fff;
 cursor:pointer;
 padding:6px;
 display:grid;
 place-items:center;
 border-radius:10px;
 transition:background 0.2s;
}
.cm-control-btn:hover{
 background:rgba(255,255,255,0.18);
}
.cm-control-btn svg{
 width:21px;height:21px;
 fill:currentColor;
 stroke:none;
}
.cm-time-display{
 font-size:11px;
 color:#e0e0e0;
 font-weight:700;
 letter-spacing:0.5px;
}
.speed-btn{
 font-size:11px;
 font-weight:900;
 padding:4px 9px;
 background:rgba(255,255,255,0.14);
 border-radius:8px;
}
/* گرافیک لوکوی کوچک CodeMarket داخل کنترل‌های ویدیو */
.cm-player-logo {
 width:26px;
 height:26px;
 border-radius:8px;
 display:grid;
 place-items:center;
 background:linear-gradient(145deg,#ff3440,#750009);
 font-size:10px;
 font-weight:900;
 color:#fff;
 box-shadow:0 2px 10px rgba(229,9,25,0.45);
 user-select:none;
 letter-spacing:-0.5px;
}

@media(max-width:520px){
 .grid{grid-template-columns:1fr 1fr}
 .thumb{height:105px}
}

/* =========================================================
   CODEMARKET PREMIUM VISUAL LAYER — UI ONLY
   ========================================================= */
:root{
 --cm-glow:rgba(229,9,25,.28);--cm-soft:#1a1a1c;--cm-border:rgba(255,255,255,.08);
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 50% 0,rgba(229,9,25,.08),transparent 38%)}
.app{position:relative}
header{padding:18px 16px 12px;position:sticky;top:0;z-index:40;background:linear-gradient(#070707 72%,transparent);backdrop-filter:blur(8px)}
.brand{font-size:22px;letter-spacing:-.9px;text-shadow:0 0 24px rgba(229,9,25,.18)}
.icon{transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.icon:hover{transform:translateY(-2px);border-color:#5b171d;box-shadow:0 10px 35px var(--cm-glow)}
.hero{position:relative;overflow:hidden;min-height:205px;background:radial-gradient(circle at 10% 10%,rgba(255,53,66,.18),transparent 32%),linear-gradient(135deg,#30080c,#121214 58%,#0d0d0e);box-shadow:0 25px 80px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.05)}
.hero:after{content:"CM";position:absolute;left:-12px;bottom:-35px;font-size:150px;font-weight:900;color:rgba(255,255,255,.025);line-height:1;pointer-events:none}
.hero>*{position:relative;z-index:1}
.section{margin-top:28px}.section h2{font-size:18px;letter-spacing:-.3px}
.card{box-shadow:0 12px 35px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.025);transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{border-color:#363638;box-shadow:0 16px 42px rgba(0,0,0,.32),0 0 0 1px rgba(229,9,25,.03)}
.grid{gap:13px}
.course{position:relative;border-radius:22px}
.thumb{height:145px;position:relative;overflow:hidden;background:radial-gradient(circle at 25% 20%,#75151d,#171719 65%)}
.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.55));pointer-events:none}
.course .body{background:linear-gradient(180deg,rgba(255,255,255,.015),transparent)}
.course .body h3{font-size:14px;line-height:1.7;min-height:47px}
.btn{box-shadow:0 8px 25px rgba(229,9,25,.13);transition:.22s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.secondary:hover{box-shadow:0 8px 25px rgba(255,255,255,.06)}
.bottom{box-shadow:0 15px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.02);padding:7px;bottom:12px}
.nav{transition:.2s}.nav.active{box-shadow:inset 0 0 24px rgba(229,9,25,.08)}
.progress-wrap{margin-top:11px}.progress-meta{display:flex;justify-content:space-between;align-items:center;color:#999;font-size:10px;margin-bottom:5px}.progress-track{height:6px;background:#242426;border-radius:99px;overflow:hidden}.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#a60712,#ff3542);box-shadow:0 0 12px rgba(229,9,25,.35);transition:width .4s}
.course-progress-card{margin-top:12px;padding:12px 14px;background:linear-gradient(145deg,#171719,#101011)}
.detail-hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--cm-border);box-shadow:0 18px 55px rgba(0,0,0,.45)}
.detail-hero .thumb{height:190px}.detail-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.85));display:flex;align-items:flex-end;padding:18px}
.detail-title{font-size:20px;font-weight:900;line-height:1.5}
.detail-chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.detail-chip{background:#18181a;border:1px solid #2a2a2c;padding:7px 10px;border-radius:11px;font-size:11px;color:#ccc}.detail-chip b{color:#fff}
.course-price-card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;background:linear-gradient(135deg,#1b090c,#151517);border-color:#4a171c}
.notification-card{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;margin:10px 0;background:linear-gradient(145deg,#18181a,#111113);border:1px solid #29292c;overflow:hidden}.notification-card.unread{border-color:#55151b;background:linear-gradient(145deg,#220b0f,#121214)}.notification-card.unread:before{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--red)}.notif-icon{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#3a0a0f,#171719);color:#ff5360;box-shadow:0 7px 25px rgba(229,9,25,.14)}.notif-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}.notif-dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);margin-top:7px}
.support-window{background:radial-gradient(circle at 100% 0,rgba(229,9,25,.10),transparent 35%),#0d0d0f;border:1px solid #29292c;border-radius:24px;overflow:hidden}.support-head{display:flex;align-items:center;gap:11px;padding:14px 15px;background:rgba(255,255,255,.025);border-bottom:1px solid #252527}.support-avatar{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#ff3440,#750009);font-weight:900;box-shadow:0 8px 28px rgba(229,9,25,.25)}.online-dot{width:9px;height:9px;border-radius:50%;background:#24c77b;box-shadow:0 0 12px rgba(36,199,123,.75);display:inline-block;margin-left:5px}.online-text{color:#42db91;font-size:10px}.support-messages{min-height:300px;max-height:48vh;overflow:auto;padding:13px}.chat-message{max-width:82%;padding:11px 13px;border-radius:18px;margin:8px 0;font-size:12px;line-height:1.8;box-shadow:0 6px 18px rgba(0,0,0,.16)}.chat-message.me{margin-right:auto;background:linear-gradient(145deg,#5a0c14,#36080d);border-bottom-right-radius:6px}.chat-message.support{margin-left:auto;background:linear-gradient(145deg,#202023,#171719);border-bottom-left-radius:6px}.support-compose{display:flex;gap:8px;align-items:flex-end;padding:10px;border-top:1px solid #252527;background:#111113}.support-compose .textarea{min-height:48px;height:48px;resize:none;border-radius:17px}.support-send{width:52px!important;height:48px;padding:0!important;margin:0!important;border-radius:16px!important;flex:0 0 52px}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.thumb{height:125px}.detail-hero .thumb{height:170px}}


/* =========================================================
   CODEMARKET PREMIUM UI POLISH
   ========================================================= */
:root{
 --cm-red:#ff3344; --cm-red2:#9e101c; --cm-dark:#09090b;
 --cm-glass:rgba(20,20,24,.72);
}
body{background:
 radial-gradient(circle at 85% 5%,rgba(255,35,55,.10),transparent 25%),
 radial-gradient(circle at 10% 35%,rgba(255,35,55,.06),transparent 28%),
 #08080a;}
#page{padding-bottom:105px}
.hero{
 position:relative;overflow:hidden;
 padding:28px 24px;min-height:220px;
 display:flex;flex-direction:column;justify-content:center;
 background:
 linear-gradient(135deg,rgba(100,7,14,.92),rgba(15,12,15,.96) 58%,rgba(10,10,12,.98)),
 radial-gradient(circle at 90% 10%,rgba(255,50,65,.3),transparent 35%);
 border:1px solid rgba(255,70,80,.22);
 box-shadow:0 22px 70px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.06);
}
.hero:before{
 content:"";position:absolute;width:210px;height:210px;border-radius:50%;
 left:-75px;bottom:-115px;background:rgba(255,35,55,.16);filter:blur(3px)
}
.hero:after{
 content:"CM";position:absolute;left:24px;top:22px;font-size:90px;
 font-weight:1000;letter-spacing:-8px;color:rgba(255,255,255,.035)
}
.hero h1{position:relative;z-index:1;font-size:30px;line-height:1.45;margin:8px 0}
.hero .muted,.hero .btn{position:relative;z-index:1}
.section{margin-top:24px}
.section h2{font-size:18px}
.card{
 box-shadow:0 12px 35px rgba(0,0,0,.20);
 transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.card:hover{transform:translateY(-2px);border-color:rgba(255,50,65,.25)}
.course{overflow:hidden;padding:0}
.course .body{padding:14px}
.course .thumb{height:165px;position:relative;background-color:#16161a}
.course .thumb:after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.8));
}
.course-progress-card{
 background:linear-gradient(145deg,#171115,#101012);
 border-color:rgba(255,55,70,.22);padding:17px
}
.progress-track{height:8px;border-radius:99px;background:#25252a;overflow:hidden}
.progress-fill{
 height:100%;border-radius:99px;
 background:linear-gradient(90deg,#8e0d18,#ff3c4d);
 box-shadow:0 0 14px rgba(255,40,60,.32)
}
.wallet-home-card{
 position:relative;overflow:hidden;padding:22px;
 background:

/* =========================================================
   GZIP / BASE64
   ========================================================= */

function bytesToBase64(bytes){
 let binary="";
 const chunk=32768;
 for(let i=0;i<bytes.length;i+=chunk){
  binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
 }
 return btoa(binary);
}

function base64ToBytes(base64){
 const binary=atob(base64);
 const bytes=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++){
  bytes[i]=binary.charCodeAt(i);
 }
 return bytes;
}

function packDatabase(data){
 const json=JSON.stringify(data);
 const compressed=pako.gzip(new TextEncoder().encode(json),{level:9});
 return{
  encoding:"gzip+base64",
  schemaVersion:4,
  compressedData:bytesToBase64(compressed),
  updatedAt:now()
 };
}

function unpackDatabase(record){
 if(record?.compressedData){
  return JSON.parse(new TextDecoder().decode(pako.ungzip(base64ToBytes(record.compressedData))));
 }
 if(record?.data?.compressedData){
  return JSON.parse(new TextDecoder().decode(pako.ungzip(base64ToBytes(record.data.compressedData))));
 }
 return record;
}

/* =========================================================
   JSONBIN
   ========================================================= */

function isConfigured(){
 return CONFIG.JSONBIN_API_KEY && !CONFIG.JSONBIN_API_KEY.startsWith("YOUR_");
}

async function loadDatabase(){
 if(!isConfigured()){
  const local=localStorage.getItem("CM_DEMO_DATABASE");
  if(local){return JSON.parse(local);}
  return structuredClone(EMPTY_DB);
 }
 const response=await fetch(`${CONFIG.API_BASE}/${CONFIG.JSONBIN_BIN_ID}/latest`,{
  method:"GET",
  headers:{
   "X-Master-Key":CONFIG.JSONBIN_API_KEY,
   "X-Access-Key":CONFIG.JSONBIN_API_KEY
  }
 });
 if(!response.ok){throw new Error("دریافت اطلاعات از JSONBin ناموفق بود");}
 const result=await response.json();
 return unpackDatabase(result.record);
}

async function saveDatabase(){
 if(!DB)return;
 if(!isConfigured()){
  localStorage.setItem("CM_DEMO_DATABASE",JSON.stringify(DB));
  return;
 }
 const response=await fetch(`${CONFIG.API_BASE}/${CONFIG.JSONBIN_BIN_ID}`,{
  method:"PUT",
  headers:{
   "Content-Type":"application/json",
   "X-Master-Key":CONFIG.JSONBIN_API_KEY,
   "X-Access-Key":CONFIG.JSONBIN_API_KEY
  },
  body:JSON.stringify(packDatabase(DB))
 });
 if(!response.ok){throw new Error("ذخیره اطلاعات در JSONBin ناموفق بود");}
}

async function save(){
 if(saveBusy){
  saveAgain=true;
  return;
 }
 saveBusy=true;
 try{
  DB.meta=DB.meta||{};
  DB.meta.revision=(DB.meta.revision||0)+1;
  DB.meta.updatedAt=now();
  await saveDatabase();
 }catch(error){
  console.error(error);
  toast(error.message||"خطا در ذخیره اطلاعات");
 }finally{
  saveBusy=false;
  if(saveAgain){
   saveAgain=false;
   save();
  }
 }
}

 let hash=2166136261;
 for(const char of value){
  hash^=char.charCodeAt(0);
  hash=Math.imul(hash,16777619);
 }
 return (hash>>>0).toString(16);
}

   showAuth("login");

   clearSession();
   hideLoading();

   hideLoading();

  synchronizeWallet();
  hideLoading();
  renderApp();

async function login(event){
 event.preventDefault();
 const identifier=$("loginIdentifier").value.trim().toLowerCase();
 const password=$("loginPassword").value;
 const found=DB.users.find(user=>
  (user.email||"").toLowerCase()===identifier || (user.phone||"")===identifier
 );
 if(!found){toast("اطلاعات ورود صحیح نیست");return;}
 if(found.password_hash!==simpleHash(password)){toast("رمز عبور صحیح نیست");return;}
 if(found.status!=="active" && found.status!=="blocked"){toast("حساب شما فعال نیست");return;}
 showLoading("در حال ورود به حساب...");
 CURRENT_USER=found;
 CURRENT_USER.last_login=now();
 setSession(CURRENT_USER.id);
 DB.activity_logs.push({id:uid("log"),user_id:CURRENT_USER.id,type:"login",created_at:now()});
 await save();
 hideLoading();
 renderApp();
}

async function register(event){
 event.preventDefault();
 const name=$("registerName").value.trim();
 const phone=$("registerPhone").value.trim().replace(/[\s()-]/g,"");

 if(!/^\+?[0-9]{10,15}$/.test(phone)){
  toast("شماره موبایل معتبر وارد کنید");
  return;
 }

 if(DB.users.some(u=>(email && (u.email||"").toLowerCase()===email)||(phone && (u.phone||"").replace(/[\s()-]/g,"")===phone))){
  toast("این حساب قبلاً ثبت شده است");

 }

 const newUser={

  email,
  phone,
  password_hash:simpleHash(password),

  status:"active",
  referral_code:"CM-"+Math.random().toString(36).slice(2,8).toUpperCase(),
  marketing_code:"",
  referred_by:"",
  wallet:{
   balance:0,
   available_balance:0,

 };

 DB.users.push(newUser);
 DB.wallets.push({

  available_balance:0,
  pending_balance:0,
  updated_at:now()
 });

 if(referral){
  const inviter=DB.users.find(u=>u.referral_code===referral);
  if(inviter){
   newUser.referred_by=inviter.id;
   DB.referrals.push({

 CURRENT_USER=newUser;
 setSession(newUser.id);
 await save();
 renderApp();

function getCourseProgress(course){
 const lessons=course?.lessons||[];
 const progress=CURRENT_USER?.completed_lessons?.[course?.id]||{};
 const completed=lessons.reduce((n,_,i)=>n+(progress[i]?1:0),0);
 return {completed,total:lessons.length,percent:lessons.length?Math.round(completed/lessons.length*100):0};
}

function applyDiscountCode(courseId){
 const course=DB.courses.find(c=>c.id===courseId);
 const code=$("discountCodeInput").value.trim();
 const msgEl=$("discountMessage");
 const priceEl=$("coursePriceDisplay");
 if(!code){
  msgEl.textContent="لطفاً کد تخفیف را وارد کنید.";
  return;
 }
 const marketer=DB.users.find(u=>u.role==="marketer" && u.marketing_code===code);
 if(!marketer){
  msgEl.textContent="کد تخفیف معتبر نیست.";
  activeDiscount=null;
  priceEl.textContent=money(course.price);
  return;
 }
 const discountPercent=Number(DB.settings.marketer_discount_percent)||3;
 const originalPrice=Number(course.price)||0;
 const discountAmount=Math.floor(originalPrice * discountPercent / 100);
 const newPrice=originalPrice - discountAmount;

 activeDiscount={marketerId:marketer.id, discountPercent, code};
 msgEl.innerHTML=`<span class="ok">کد تخفیف شما اعمال شد</span>`;
 priceEl.textContent=money(newPrice);
}

function openLessons(id){
 const course=DB.courses.find(c=>c.id===id);

 const courseProgress = CURRENT_USER.completed_lessons[id] || {};

 openModal(`

   <div class="progress-meta"><span>پیشرفت دوره</span><b>${getCourseProgress(course).percent}%</b></div>
   <div class="progress-track"><div class="progress-fill" style="width:${getCourseProgress(course).percent}%"></div></div>
   <div class="muted" style="margin-top:7px">${getCourseProgress(course).completed} از ${(course.lessons||[]).length} فصل تکمیل شده</div>
  </div>

  ${(course.lessons||[]).map((lesson,index)=>{
   const desc = lesson.description || lesson.text || lesson.content || "";
   const videoField = lesson.video || "";
   const isTextVideo = desc.includes("mp4") || desc.includes(".mp4") || (desc.startsWith("http") && (desc.includes("mp4") || desc.includes("video") || desc.includes("mov") || desc.includes("mkv") || desc.includes("webm")));
   const videoSrc = videoField || (isTextVideo ? desc : "");
   const displayDescription = desc && !isTextVideo && !videoField;

   let isLocked = false;
   if(index > 0) {
    const prevCompleted = courseProgress[index - 1];
    if(!prevCompleted) {
     isLocked = true;
    }
   }
   const isCompleted = !!courseProgress[index];

   return `
   <div class="accordion-item ${isLocked ? 'locked' : ''} ${isCompleted ? 'completed' : ''}" id="lesson_${index}">
    <div class="accordion-header" onclick="toggleAccordion('lesson_${index}', ${index}, '${id}')">
     <span>${index+1}. ${escapeHTML(lesson.title||"درس")} ${isCompleted ? '✅' : (isLocked ? '🔒' : '')}</span>
     <span>${isLocked ? '🔒' : '▼'}</span>
    </div>
    <div class="accordion-body">
     ${displayDescription ? `<p class="muted">${escapeHTML(desc)}</p>` : ""}
     ${videoSrc ? `
      <div class="cm-video-player paused">
       <video src="${escapeHTML(videoSrc)}" playsinline preload="metadata"></video>
       <div class="cm-video-overlay" onclick="togglePlay(this)">
        <div class="cm-big-play-btn">
         <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg>
        </div>

function initCustomVideoPlayers() {
 document.querySelectorAll('.cm-video-player').forEach(player => {
  const video = player.querySelector('video');
  const progressBar = player.querySelector('.cm-progress-bar');
  const timeDisplay = player.querySelector('.cm-time-display');

  video.addEventListener('click', () => toggleVideoPlay(player));
  
  video.addEventListener('timeupdate', () => {
   if(video.duration) {
    const percent = (video.currentTime / video.duration) * 100;
    progressBar.style.width = percent + '%';
    timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
   }
  });

  video.addEventListener('ended', () => {
   player.classList.remove('playing');
   player.classList.add('paused');
  });
 });
}

function toggleVideoPlay(player) {
 const video = player.querySelector('video');
 const playBtnSvg = player.querySelector('.play-pause-btn svg');
 if(video.paused) {
  video.play();
  player.classList.add('playing');
  player.classList.remove('paused');
  if(playBtnSvg) playBtnSvg.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>';
 } else {
  video.pause();
  player.classList.remove('playing');
  player.classList.add('paused');
  if(playBtnSvg) playBtnSvg.innerHTML = '<polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>';
 }
}

function togglePlay(overlay) {
 const player = overlay.closest('.cm-video-player');
 toggleVideoPlay(player);
}

function togglePlayBtn(btn) {
 const player = btn.closest('.cm-video-player');
 toggleVideoPlay(player);
}

function seekVideo(event, container) {
 const player = container.closest('.cm-video-player');
 const video = player.querySelector('video');
 if(!video.duration) return;
 
 const rect = container.getBoundingClientRect();
 let pos = (event.clientX - rect.left) / rect.width;
 pos = Math.max(0, Math.min(1, pos));
 
 video.currentTime = pos * video.duration;
}

function formatTime(seconds) {
 const m = Math.floor(seconds / 60);
 const s = Math.floor(seconds % 60);
 return m + ':' + (s < 10 ? '0' : '') + s;
}

function changeSpeed(btn) {
 const player = btn.closest('.cm-video-player');
 const video = player.querySelector('video');
 const speeds = [1, 1.25, 1.5, 2];
 let currentIdx = speeds.indexOf(video.playbackRate);
 currentIdx = (currentIdx + 1) % speeds.length;
 video.playbackRate = speeds[currentIdx];
 btn.textContent = speeds[currentIdx] + 'x';
 toast('سرعت پخش: ' + speeds[currentIdx] + 'x');
}

function toggleFullscreen(btn) {
 const player = btn.closest('.cm-video-player');
 if(!document.fullscreenElement) {
  player.requestFullscreen().catch(() => {
   toast('خطا در ورود به حالت تمام‌صفحه');
  });
 } else {
  document.exitFullscreen();
 }
}

async function purchaseCourse(id){
 const course=DB.courses.find(c=>c.id===id);
 if(!course)return;
 let price=Number(course.price)||0;
 let marketerToCredit=null;

 if(activeDiscount){
  const discountPercent=activeDiscount.discountPercent;
  const discountAmount=Math.floor(price * discountPercent / 100);
  price=price - discountAmount;
  marketerToCredit=activeDiscount.marketerId;
 }

 if(!course.is_free && CURRENT_USER.wallet.balance<price){
  closeModal();
  toast("موجودی کیف پول کافی نیست");
  renderApp("wallet");
  return;
 }
 if(!course.is_free){
  CURRENT_USER.wallet.balance-=price;
  CURRENT_USER.wallet.available_balance=CURRENT_USER.wallet.balance;
  CURRENT_USER.wallet.total_spent+=price;
  addWalletTransaction("course_purchase",-price,"خرید دوره",id,"completed");
 }
 const purchase={
  id:uid("purchase"),
  user_id:CURRENT_USER.id,
  course_id:id,
  amount:price,
  status:"completed",
  created_at:now()
 };
 DB.purchases.push(purchase);
 DB.payments.push(purchase);
 CURRENT_USER.stats.courses_purchased++;

 const referral=DB.referrals.find(r=>r.referred_user_id===CURRENT_USER.id && r.status==="registered" && !r.reward_paid);
 if(referral){
  const inviter=getUser(referral.referrer_id);
  if(inviter){
   const reward=Number(DB.settings.referral_reward)||40000;
   inviter.wallet.balance+=reward;
   inviter.wallet.available_balance=inviter.wallet.balance;
   inviter.wallet.total_income+=reward;
   inviter.wallet.total_referral_reward+=reward;
   inviter.stats.successful_referrals++;
   referral.status="converted";
   referral.reward_paid=true;
   referral.converted_at=now();

   DB.wallet_transactions.push({
    id:uid("tx"),
    user_id:inviter.id,
    type:"referral_reward",
    amount:reward,
    balance_after:inviter.wallet.balance,
    description:"پاداش دعوت پس از اولین خرید موفق",
    reference_id:purchase.id,
    status:"completed",
    created_at:now()
   });
   DB.notifications.push({
    id:uid("notif"),
    user_id:inviter.id,
    title:"پاداش دعوت",
    text:`مبلغ ${money(reward)} بابت خرید موفق فرد دعوت‌شده به کیف پول شما اضافه شد.`,
    read:false,
    created_at:now()
   });
  }
 }

 if(marketerToCredit){
  const marketer=DB.users.find(u=>u.id===marketerToCredit);
  if(marketer){
   registerMarketingSale(marketer,purchase,Number(course.price)||0);
  }
 }else if(course.marketing_code){
  const marketer=DB.users.find(u=>u.role==="marketer" && u.marketing_code===course.marketing_code);
  if(marketer){
   registerMarketingSale(marketer,purchase,Number(course.price)||0);
  }
 }

 await save();
 closeModal();
 toast("خرید با موفقیت انجام شد؛ دروس باز شدند");
 openLessons(id);
}

function registerMarketingSale(marketer,purchase,originalPrice){
 const settings=DB.settings;
 const currentMonthStart=new Date();
 currentMonthStart.setDate(1);
 currentMonthStart.setHours(0,0,0,0);

 const monthlySales=DB.marketing_sales.filter(s=>s.marketer_id===marketer.id && s.status==="completed" && new Date(s.created_at)>=currentMonthStart).length;
 const commissionPercent=monthlySales+1>=Number(settings.blue_badge_monthly_sales)?Number(settings.blue_badge_commission_percent):Number(settings.marketer_commission_percent);
 const commission=Math.floor(Number(originalPrice)*commissionPercent/100);

 DB.marketing_sales.push({
  id:uid("ms"),
  marketer_id:marketer.id,
  buyer_id:purchase.user_id,
  course_id:purchase.course_id,
  purchase_id:purchase.id,
  sale_amount:originalPrice,
  commission_percent:commissionPercent,
  commission,
  status:"completed",
  created_at:now()
 });

 marketer.wallet.balance+=commission;
 marketer.wallet.available_balance=marketer.wallet.balance;
 marketer.wallet.total_income+=commission;
 marketer.wallet.total_marketing_commission+=commission;
 marketer.stats.marketing_sales++;

 DB.wallet_transactions.push({
  id:uid("tx"),
  user_id:marketer.id,
  type:"marketing_commission",
  amount:commission,
  balance_after:marketer.wallet.balance,
  description:`کمیسیون فروش بازاریابی (${commissionPercent}٪)`,
  reference_id:purchase.id,
  status:"completed",
  created_at:now()
 });
 updateMarketingBadge(marketer);
}

function updateMarketingBadge(user){
 const start=new Date();
 start.setDate(1);
 start.setHours(0,0,0,0);
 const sales=DB.marketing_sales.filter(s=>s.marketer_id===user.id && s.status==="completed" && new Date(s.created_at)>=start).length;
 user.current_month_sales=sales;

 }
}

 if(!isMarketingActive()){toast("بازاریابی شما فعال نیست");return;}
 withdrawState={amount:0,method:"card",destination:""};
 renderWithdrawStep1();
}

function isMarketingActive(){
 return CURRENT_USER.role==="marketer" && DB.marketers.some(m=>m.user_id===CURRENT_USER.id && m.status==="active");
}

function renderWithdrawStep1(){
 openModal(`
  ${renderStepper(1)}
  <div class="info">حداقل برداشت: <b>${money(500000)}</b><br>موجودی: <b>${money(CURRENT_USER.wallet.balance)}</b></div>
  <form class="form" style="margin-top:12px" onsubmit="withdrawStep2(event)">
   <input id="withdrawAmount" class="input" type="number" min="500000" placeholder="مبلغ برداشت" required>
   <button class="btn">مرحله بعد</button>
  </form>
 `);
}

function withdrawStep2(event){
 event.preventDefault();
 const amount=Number($("withdrawAmount").value);
 if(amount<500000){toast("حداقل برداشت ۵۰۰ هزار تومان است");return;}
 if(amount>CURRENT_USER.wallet.balance){toast("موجودی کافی نیست");return;}
 withdrawState.amount=amount;
 openModal(`
  ${renderStepper(2)}
  <div class="info">مبلغ برداشت: <b>${money(amount)}</b></div>
  <div class="method" style="margin-top:12px">
   <button class="active" onclick="withdrawMethod('card')">کارت</button>
   <button onclick="withdrawMethod('sheba')">شبا</button>
  </div>
  <div id="withdrawDestinationArea" style="margin-top:12px">
   <input id="withdrawDestination" class="input" placeholder="شماره کارت مقصد" inputmode="numeric">
  </div>
  <button class="btn" onclick="withdrawStep3()">مرحله بعد</button>
  <button class="btn secondary" onclick="renderWithdrawStep1()">بازگشت</button>
 `);
}

function withdrawMethod(method){
 withdrawState.method=method;
 document.querySelectorAll(".method button").forEach((button,index)=>{
  button.classList.toggle("active",(method==="card"&&index===0)||(method==="sheba"&&index===1));
 });
 $("withdrawDestinationArea").innerHTML=`
  <input id="withdrawDestination" class="input" placeholder="${method==="card"?"شماره کارت مقصد":"شماره شبا"}" ${method==="sheba"?'dir="ltr"':''} required>
 `;
}

function withdrawStep3(){
 const destination=$("withdrawDestination").value.trim();
 if(!destination){toast("اطلاعات مقصد را وارد کنید");return;}
 withdrawState.destination=destination;
 openModal(`
  ${renderStepper(3)}
  <div class="card">
   <div class="row"><span>مبلغ</span><b>${money(withdrawState.amount)}</b></div>
   <div class="divider"></div>
   <div class="row"><span>روش</span><b>${withdrawState.method==="card"?"کارت":"شبا"}</b></div>
   <div class="divider"></div>
   <div class="row"><span>مقصد</span><b style="direction:ltr">${escapeHTML(withdrawState.destination)}</b></div>
  </div>
  <div class="info" style="margin-top:12px">پس از ثبت، درخواست برای بررسی ارسال می‌شود.</div>
  <button class="btn" onclick="submitWithdraw()">تأیید و ثبت درخواست</button>
  <button class="btn secondary" onclick="withdrawStep2({preventDefault(){}})">بازگشت</button>
 `);
}

async function submitWithdraw(){
 const amount=withdrawState.amount;
 if(amount<500000){toast("حداقل برداشت ۵۰۰ هزار تومان است");return;}
 if(amount>CURRENT_USER.wallet.balance){toast("موجودی کافی نیست");return;}

 const before=CURRENT_USER.wallet.balance;
 CURRENT_USER.wallet.balance-=amount;
 CURRENT_USER.wallet.available_balance=CURRENT_USER.wallet.balance;
 CURRENT_USER.wallet.pending_balance+=amount;

 const request={
  id:uid("withdraw"),
  user_id:CURRENT_USER.id,
  amount,
  method:withdrawState.method,
  destination:withdrawState.destination,
  status:"pending",
  created_at:now(),
  reviewed_at:null,
  reviewed_by:null,
  admin_note:""
 };
 DB.withdrawals.push(request);
 DB.wallet_transactions.push({
  id:uid("tx"),
  user_id:CURRENT_USER.id,
  type:"withdrawal_pending",
  amount:-amount,
  balance_before:before,
  balance_after:CURRENT_USER.wallet.balance,
  description:"رزرو مبلغ درخواست برداشت",
  reference_id:request.id,
  status:"pending",
  created_at:now()
 });
 DB.notifications.push({
  id:uid("notif"),
  user_id:CURRENT_USER.id,
  title:"درخواست برداشت ثبت شد",
  text:"درخواست برداشت شما در انتظار بررسی است.",
  read:false,
  created_at:now()
 });
 await save();
 closeModal();
 toast("درخواست برداشت ثبت شد");
 renderApp("wallet");
}

function getMonthlyMarketingSales(){
 const start=new Date();
 start.setDate(1);
 start.setHours(0,0,0,0);
 return DB.marketing_sales.filter(s=>s.marketer_id===CURRENT_USER.id && s.status==="completed" && new Date(s.created_at)>=start).length;
}

function getRealMarketingChartData(){
 const installDate = new Date(getInstallTimestamp());
 const sales = DB.marketing_sales.filter(s=>s.marketer_id===CURRENT_USER.id && s.status==="completed");
 const labels = [];
 const data = [];
 
 for(let i=3; i>=0; i--){
  const d = new Date();
  d.setMonth(d.getMonth() - i);
  if(d >= new Date(installDate.getFullYear(), installDate.getMonth(), 1)){
   const monthName = d.toLocaleString('fa-IR', { month: 'long' });
   labels.push(monthName);
   const mStart = new Date(d.getFullYear(), d.getMonth(), 1);
   const mEnd = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59);
   const count = sales.filter(s=>{
    const sDate = new Date(s.created_at);
    return sDate >= mStart && sDate <= mEnd;
   }).length;
   data.push(count);
  }
 }
 
 if(labels.length === 0){
  const currentMonthName = new Date().toLocaleString('fa-IR', { month: 'long' });
  labels.push(currentMonthName);
  data.push(0);
 }
 return { labels, data };
}

<script id="cm-wallet-status-sync">
(function(){
  function n(v){ return Number(v)||0; }
  function syncWalletStatuses(){
    if(!window.CURRENT_USER || !window.CURRENT_USER.wallet || !window.DB) return;
    const uid=window.CURRENT_USER.id;
    const w=window.CURRENT_USER.wallet;
    const topups=(window.DB.topups||[]).filter(x=>x.user_id===uid);
    const withdrawals=(window.DB.withdrawals||[]).filter(x=>x.user_id===uid);
    let completedTopup=0, rejectedTopup=0, pendingTopup=0;
    topups.forEach(t=>{
      const s=String(t.status||"pending").toLowerCase();
      if(s==="completed"||s==="approved"||s==="confirmed") completedTopup+=n(t.amount);
      else if(s==="rejected"||s==="declined") rejectedTopup+=n(t.amount);
      else pendingTopup+=n(t.amount);
    });
    let pendingWithdraw=0;
    withdrawals.forEach(x=>{
      const s=String(x.status||"pending").toLowerCase();
      if(s==="pending"||s==="processing") pendingWithdraw+=n(x.amount);
    });
    /* Rebuild pending from actual outstanding requests. */
    w.pending_balance = Math.max(0,pendingTopup+pendingWithdraw);
    /* Keep available balance aligned with actual balance. */
    w.available_balance = n(w.balance);
    const walletRow=(window.DB.wallets||[]).find(x=>x.user_id===uid);
    if(walletRow){
      walletRow.balance=n(w.balance);
      walletRow.available_balance=n(w.available_balance);
      walletRow.pending_balance=n(w.pending_balance);
      walletRow.updated_at=typeof now==="function"?now():new Date().toISOString();
    }
  }

  function notifyStatusChanges(){
    if(!window.CURRENT_USER || !window.DB) return;
    const uid=window.CURRENT_USER.id;
    const mark="cm_status_notified_v1";
    const seen=JSON.parse(localStorage.getItem(mark)||"{}");
    const list=[...(window.DB.topups||[]),...(window.DB.withdrawals||[])].filter(x=>x.user_id===uid);
    let changed=false;
    list.forEach(x=>{
      const s=String(x.status||"pending").toLowerCase();
      if(!["completed","approved","confirmed","rejected","declined"].includes(s)) return;
      const key=x.id+":"+s;
      if(seen[key]) return;
      const isTop=(window.DB.topups||[]).some(t=>t.id===x.id);
      const title=isTop
        ? (["rejected","declined"].includes(s)?"شارژ کیف پول رد شد":"شارژ کیف پول تأیید شد")
        : (["rejected","declined"].includes(s)?"درخواست برداشت رد شد":"درخواست برداشت تأیید شد");
      const text=isTop
        ? (["rejected","declined"].includes(s)
            ?"درخواست شارژ شما رد شد و مبلغ در حالت قابل استفاده قرار گرفت."
            :"شارژ شما تأیید شد و مبلغ به موجودی قابل استفاده اضافه شد.")
        : (["rejected","declined"].includes(s)
            ?"درخواست برداشت شما رد شد و مبلغ به موجودی کیف پول برگشت."
            :"درخواست برداشت شما تأیید شد و مبلغ از موجودی در انتظار خارج شد.");
      window.DB.notifications=window.DB.notifications||[];
      window.DB.notifications.push({
        id:(typeof uid==="function"?uid("notif"):"notif_"+Date.now()+"_"+Math.random()),
        user_id:window.CURRENT_USER.id,
        title:title,text:text,read:false,created_at:typeof now==="function"?now():new Date().toISOString(),
        reference_id:x.id,status:"completed"
      });
      seen[key]=1; changed=true;
    });
    if(changed) localStorage.setItem(mark,JSON.stringify(seen));
  }

  window.cmSyncWalletStatuses=syncWalletStatuses;
  window.cmNotifyWalletStatuses=notifyStatusChanges;
  function run(){
    try{syncWalletStatuses();notifyStatusChanges();}catch(e){}
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",run);
  else run();
  setTimeout(run,500);
  setTimeout(run,1500);
})();
</script>


<script id="cm-support-notification-sync">
(function(){
  function run(){
    if(!window.CURRENT_USER || !window.DB) return;
    const uid=window.CURRENT_USER.id;
    const msgs=(window.DB.support_messages||[]).filter(m=>m.user_id===uid && (m.sender==="support"||m.from==="support"||m.role==="support"));
    const seen=JSON.parse(localStorage.getItem("cm_support_notifs_v1")||"{}");
    let changed=false;
    window.DB.notifications=window.DB.notifications||[];
    msgs.forEach(m=>{
      const key=m.id||((m.created_at||"")+"|"+(m.text||""));
      if(seen[key]) return;
      window.DB.notifications.push({
        id:"notif_support_"+Date.now()+"_"+Math.random(),
        user_id:uid,
        title:"پیام جدید از پشتیبانی",
        text:m.text||"پشتیبانی برای شما پیام جدیدی ارسال کرده است.",
        read:false,
        created_at:m.created_at||new Date().toISOString(),
        reference_id:m.id||"",
        type:"support"
      });
      seen[key]=1;changed=true;
    });
    if(changed) localStorage.setItem("cm_support_notifs_v1",JSON.stringify(seen));
  }
  window.cmSyncSupportNotifications=run;
  run();
  setTimeout(run,800);
  setTimeout(run,1800);
})();
</script>
